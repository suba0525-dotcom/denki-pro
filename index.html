let state=JSON.parse(localStorage.getItem('denkiProStats')||'{"total":0,"correct":0,"wrong":[]}');let session=[],idx=0,correctThis=0,answered=false,mode='practice';function save(){localStorage.setItem('denkiProStats',JSON.stringify(state));renderStats()}function renderStats(){document.getElementById('answered').textContent=state.total;document.getElementById('accuracy').textContent=state.total?Math.round(state.correct/state.total*100)+'%':'—';document.getElementById('wrongCount').textContent=state.wrong.length;document.getElementById('totalLine').textContent=state.total+'問';document.getElementById('correctLine').textContent=state.correct+'問';document.getElementById('wrongLine').textContent=state.wrong.length+'問'}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active')}function goHome(){show('home');renderStats()}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startDaily(){begin(shuffle(questions).slice(0,5),'今日の5問')}function startTopic(topic){let q=topic==='all'?questions:questions.filter(x=>x.t===topic);if(!q.length){toast('この分野の問題は準備中です');return}begin(shuffle(q).slice(0,Math.min(10,q.length)),topic==='all'?'全分野練習':topic)}function startWrong(){let ids=new Set(state.wrong);let q=questions.filter((x,i)=>ids.has(i));if(!q.length){toast('復習問題はまだないよ！');return}begin(shuffle(q),'間違い問題復習')}function startMock(){begin(shuffle(questions).slice(0,Math.min(50,questions.length)),'模擬試験（50問）')}function begin(q,label){session=q;idx=0;correctThis=0;mode=label;show('quiz');renderQuestion()}function renderQuestion(){answered=false;let q=session[idx];document.getElementById('topicLabel').textContent=mode+' / '+q.t;document.getElementById('qcount').textContent=(idx+1)+' / '+session.length;document.getElementById('bar').style.width=(idx/session.length*100)+'%';document.getElementById('questionText').textContent=q.q;document.getElementById('explain').className='explain';document.getElementById('explain').textContent='';document.getElementById('next').disabled=true;document.getElementById('next').textContent=idx===session.length-1?'結果を見る':'次の問題';let box=document.getElementById('choices');box.innerHTML='';q.a.forEach((choice,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="letter">'+['A','B','C','D'][i]+'</span><span>'+choice+'</span>';b.onclick=()=>answer(i);box.appendChild(b)})}function answer(n){if(answered)return;answered=true;let q=session[idx],buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('correct');if(i===n&&n!==q.c)b.classList.add('wrong')});state.total++;if(n===q.c){state.correct++;correctThis++;let qi=questions.indexOf(q);state.wrong=state.wrong.filter(x=>x!==qi)}else{let qi=questions.indexOf(q);if(qi>=0&&!state.wrong.includes(qi))state.wrong.push(qi)}save();let ex=document.getElementById('explain');ex.innerHTML='<strong style="color:'+(n===q.c?'var(--good)':'var(--bad)')+'">'+(n===q.c?'正解！':'不正解')+'</strong><br>'+q.e;ex.classList.add('show');document.getElementById('next').disabled=false}function nextQuestion(){if(idx<session.length-1){idx++;renderQuestion()}else finish()}function finish(){show('finish');document.getElementById('finishScore').textContent=correctThis+' / '+session.length;let pct=Math.round(correctThis/session.length*100);document.getElementById('finishTitle').textContent=pct>=80?'いい調子！':pct>=60?'合格ラインを目指そう！':'ここから伸ばそう！';document.getElementById('finishMessage').textContent='正答率 '+pct+'%。'+(pct>=80?'この調子で次の分野へ！':'解説を読み返して、復習問題で再挑戦しよう。')}function resetStats(){if(confirm('学習記録をすべてリセットする？')){state={total:0,correct:0,wrong:[]};save();toast('学習記録をリセットしました')}}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}renderStats();
